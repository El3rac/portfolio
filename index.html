<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<meta name="description" content="Portfolio de rédacteur vidéo YouTube">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:,">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="#" class="logo" id="logo-text">Portfolio</a>
    <nav class="main-nav">
      <a href="#about">À propos</a>
      <a href="#portfolio">Portfolio</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<section class="hero" id="about">
  <div class="wrap hero-inner">
    <img class="avatar" id="avatar" src="" alt="" hidden>
    <div>
      <p class="eyebrow" id="hero-eyebrow">Rédacteur vidéo YouTube</p>
      <h1 id="hero-name">Votre Nom</h1>
      <p class="hero-bio" id="hero-bio"></p>
      <div class="socials" id="socials"></div>
    </div>
  </div>
</section>

<section class="portfolio" id="portfolio">
  <div class="wrap">
    <h2 class="section-title">Portfolio</h2>
    <div class="filters" id="filters"></div>
    <div id="categories"></div>
  </div>
</section>

<footer class="site-footer" id="contact">
  <div class="wrap footer-inner">
    <p id="footer-text">Disponible pour de nouveaux projets.</p>
    <div class="socials" id="socials-footer"></div>
  </div>
</footer>

<div class="modal" id="video-modal" hidden>
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal-content">
    <button class="modal-close" id="modal-close" aria-label="Fermer">&times;</button>
    <div class="modal-player" id="modal-player"></div>
    <div class="modal-info">
      <h3 id="modal-title"></h3>
      <p id="modal-meta"></p>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
