<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elerac — Portfolio</title>
<meta name="description" content="Rédacteur de vidéos YouTube — scripts et montages pour Kombo, Aypierre, Melanchromia et sa propre chaîne.">

<!-- Ces balises Open Graph sont lues par Discord/Twitter/LinkedIn pour l'aperçu du lien.
     Elles ne peuvent pas être générées automatiquement depuis data.js (les robots de ces
     sites n'exécutent pas le JavaScript) : si tu changes de nom/bio, mets-les aussi à jour ici. -->
<meta property="og:title" content="Elerac — Portfolio">
<meta property="og:description" content="Rédacteur de vidéos YouTube — scripts et montages pour Kombo, Aypierre, Melanchromia et sa propre chaîne.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://el3rac.github.io/portfolio/">
<meta property="og:image" content="https://el3rac.github.io/portfolio/assets/logo_elerac.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Elerac — Portfolio">
<meta name="twitter:description" content="Rédacteur de vidéos YouTube — scripts et montages pour Kombo, Aypierre, Melanchromia et sa propre chaîne.">
<meta name="twitter:image" content="https://el3rac.github.io/portfolio/assets/logo_elerac.png">

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/logo_elerac.png">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo" id="logo-text">Portfolio</a>
    <nav class="main-nav">
      <a href="index.html" class="active">Accueil</a>
      <a href="projets.html">Projets</a>
      <a href="#contact">Contact</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Changer de thème"></button>
    </nav>
  </div>
</header>

<section class="clients" id="clients">
  <div class="wrap">
    <h2 class="section-title">Les chaînes avec qui j'ai travaillé</h2>
    <div class="carousel-wrap">
      <button class="carousel-arrow carousel-prev" id="carousel-prev" aria-label="Précédent">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="client-carousel" id="client-carousel"></div>
      <button class="carousel-arrow carousel-next" id="carousel-next" aria-label="Suivant">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>
</section>

<section class="hero" id="about">
  <div class="wrap hero-inner">
    <img class="avatar" id="avatar" src="" alt="" hidden>
    <div>
      <p class="eyebrow" id="hero-eyebrow">Rédacteur vidéo YouTube</p>
      <h1 id="hero-name">Votre Nom</h1>
      <p class="hero-bio" id="hero-bio"></p>
      <div class="socials" id="socials"></div>
    </div>
  </div>
  <div class="wrap">
    <div class="stats-bar reveal" id="stats-bar">
      <div class="stat-tile">
        <span class="stat-value" id="stat-videos">0</span>
        <span class="stat-label">Vidéos</span>
      </div>
      <div class="stat-tile">
        <span class="stat-value" id="stat-channels">0</span>
        <span class="stat-label">Chaînes</span>
      </div>
      <div class="stat-tile" id="stat-tile-views" hidden>
        <span class="stat-value" id="stat-views">—</span>
        <span class="stat-label">Vues cumulées</span>
      </div>
    </div>
  </div>
</section>

<section class="featured" id="featured">
  <div class="wrap">
    <h2 class="section-title">Quelques exemples de vidéos</h2>
    <div class="video-grid" id="featured-grid"></div>
    <div class="featured-cta">
      <a href="projets.html" class="cta-btn">Voir tous mes projets</a>
    </div>
  </div>
</section>

<button class="back-to-top" id="back-to-top" aria-label="Remonter en haut">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<footer class="site-footer" id="contact">
  <div class="wrap footer-inner">
    <span class="availability-badge" id="availability-badge"></span>
    <div class="footer-right">
      <div class="socials" id="socials-footer"></div>
      <button class="print-link" id="print-link" type="button">Version imprimable</button>
    </div>
  </div>
</footer>

<div class="modal" id="video-modal">
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal-content">
    <button class="modal-close" id="modal-close" aria-label="Fermer">&times;</button>
    <div class="modal-player" id="modal-player"></div>
    <div class="modal-info">
      <h3 id="modal-title"></h3>
      <p id="modal-meta"></p>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script data-goatcounter="https://elerac.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
