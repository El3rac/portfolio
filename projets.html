<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elerac — Projets</title>
<meta name="description" content="Tous les projets vidéo d'Elerac, rédacteur de vidéos YouTube — Kombo, Aypierre, Melanchromia et sa propre chaîne.">

<meta property="og:title" content="Elerac — Projets">
<meta property="og:description" content="Tous les projets vidéo d'Elerac, rédacteur de vidéos YouTube.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://el3rac.github.io/portfolio/projets.html">
<meta property="og:image" content="https://el3rac.github.io/portfolio/assets/logo_elerac.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Elerac — Projets">
<meta name="twitter:description" content="Tous les projets vidéo d'Elerac, rédacteur de vidéos YouTube.">
<meta name="twitter:image" content="https://el3rac.github.io/portfolio/assets/logo_elerac.png">

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/logo_elerac.png">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo" id="logo-text">Portfolio</a>
    <nav class="main-nav">
      <a href="index.html">Accueil</a>
      <a href="projets.html" class="active">Projets</a>
      <a href="#contact">Contact</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Changer de thème"></button>
    </nav>
  </div>
</header>

<section class="portfolio">
  <div class="wrap">
    <h1 class="section-title">Tous mes projets</h1>
    <div class="toolbar">
      <select id="role-filter" class="role-filter" hidden>
        <option value="all">Tous les rôles</option>
      </select>
    </div>
    <div class="filters" id="filters"></div>
    <div id="categories"></div>
    <div class="empty-state" id="empty-state" hidden>
      <p class="empty-title">Aucun résultat.</p>
      <p class="empty-sub">On a fouillé jusque dans les brouillons jamais publiés, toujours rien. Essaie un autre filtre.</p>
    </div>
  </div>
</section>

<button class="back-to-top" id="back-to-top" aria-label="Remonter en haut">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<footer class="site-footer" id="contact">
  <div class="wrap footer-inner">
    <span class="availability-badge" id="availability-badge"></span>
    <div class="footer-right">
      <div class="socials" id="socials-footer"></div>
      <button class="print-link" id="print-link" type="button">Version imprimable</button>
    </div>
  </div>
</footer>

<div class="modal" id="video-modal">
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal-content">
    <button class="modal-close" id="modal-close" aria-label="Fermer">&times;</button>
    <div class="modal-player" id="modal-player"></div>
    <div class="modal-info">
      <h3 id="modal-title"></h3>
      <p id="modal-meta"></p>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script data-goatcounter="https://elerac.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
