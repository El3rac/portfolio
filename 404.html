<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Elerac</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/logo_elerac.png">
<style>
  .not-found{
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }
  .not-found .code{
    font-size: 5rem;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.03em;
    margin: 0;
  }
  .not-found p{ color: var(--text-dim); margin: 8px 0 28px; }
  .not-found a{
    font-size: 0.9rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    padding: 11px 22px;
    border-radius: 999px;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="./" class="logo">Elerac</a>
  </div>
</header>

<div class="not-found">
  <p class="code">404</p>
  <p>Cette page n'existe pas ou plus.</p>
  <a href="./">Retour à l'accueil</a>
</div>

</body>
</html>
